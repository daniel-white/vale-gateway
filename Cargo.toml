[workspace]
resolver = "3"
members = [
    "build",
    "core",
    "kube",
    "http",
    "config",
    "kube-runtime",
    "rpc",
    "gateway",
    "controller",
]

[workspace.dependencies]
assertables = "9"
async-trait = "0.1"
atomic_refcell = "0.1"
base64ct = { version = "1", features = ["alloc"] }
bytes = "1"
dashmap = "7.0.0-rc2"
derive_more = { version = "2", features = ["full"] }
gateway-api = { git = "https://github.com/daniel-white/gateway-api-rs.git", branch = "deps" }
getset = "0.1"
heck = "0.5"
hickory-proto = "0.25"
http = "1"
http-serde-ext = "1"
ipnet = { version = "2", features = ["serde"] }
jsonrpsee = { version = "0.26" }
k8s-openapi = { version = "0.26", features = ["v1_34"] }
kube = "2"
kube-core = "2"
kube-leader-election = { git = "https://github.com/daniel-white/kube-leader-election.git", branch = "feat/change-result-type" }
mediatype = { version = "0.20", features = ["serde"] }
mockall = "0.13"
multi-map = "1"
ouroboros = "0.18"
opentelemetry = { version = "0.30", features = ["metrics", "logs", "tracing"] }
paste = "1"
pingora = "0.6"
problemdetails = "0.6"
regex = { version = "1", features = ["perf", "unicode"] }
rstest = "0.26"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_with = { version = "3", features = ["json"] }
serde_yaml = "0.9"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = "1"
tokio-shutdown = "0.1"
tokio-test = "0.4"
tracing = "0.1"
tracing-opentelemetry = "0.31"
trusted-proxies = "0.3"
typed-builder = "0.22"
url = "2"


version: v1alpha1
ipc:
  addr: 127.0.0.1:9000
httpListener:
  name: main-listener
  port: 8080
  filters:
    - type: upstreamRequestHeaderModifier
      set:
        x-set-header: set-value
      add:
        x-add-header: add-value
      remove:
        - x-remove-header
    - type: responseHeaderModifier
      set:
        x-set-header: set-value
      add:
        x-add-header: add-value
      remove:
        - x-remove-header
    - type: redirectResponse
      kind: temporary
      path:
        kind: prefixMatch
        value: /v2
    - type: accessControl
      key: access-key
    - type: clientAddr
      key: client-key
    - type: errorResponse
      key: error-key
    - type: errorResponse
      key: error-key-problem-detail
  filterDefinitions:
    - type: staticResponse
      key: static-key
      statusCode: 200
      body:
        key: body-key
        contentType: text/plain
    - type: accessControl
      key: access-key
      effect: allow
      clients:
        ips:
          - 127.0.0.1
    - type: clientAddr
      key: client-key
      source: header
      header: x-real-ip
    - type: errorResponse
      key: error-key
      kind: html
    - type: errorResponse
      key: error-key-problem-detail
      kind: problemDetail
      problemDetail:
        authority: https://example.com/
  routes:
    - key: my-route
      hostHeaderMatches:
        - type: inZone
          name: example.com
      rules:
        - key: my-rule
          matches:
            - path:
                kind: exact
                value: /
              headers:
                - kind: exactValue
                  header: content-type
                  value: application/json
          backends:
            - weight: 80
              port: 9090
              kind: Service
              name: my-service
              namespace: default
  backends:
  - kind: Service
    name: my-service
    namespace: default
    endpoints:
    - node: here
      zone: us-east-1a
      addrs:
      - 127.1.1.2
      - 192.168.27.4